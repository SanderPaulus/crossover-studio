# Deploy to GitHub Pages on every push to main: typecheck + tests + build,
# then publish dist/. Testers always see the latest committed version.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Docs-only pushes (README, CLAUDE.md, notes) don't change the app —
    # skip the test+deploy cycle. A mixed push (docs + code) still deploys.
    paths-ignore:
      - '**.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # DE CI-LAAG BEWAAKT DE NATUURKUNDE, DE LOKALE SUITE DE BYTES (V45).
      #
      # Niet `vitest run`: zeven reproducties vergelijken een LIVE herberekend
      # netwerk byte-voor-byte met een opgeslagen fixture, en die fixtures zijn
      # opgenomen op arm64/Node 26. Gemeten: alleen de Node-versie wijzigen
      # (26 -> 22, zelfde machine) verplaatst het zaad al op het vijfde
      # significante cijfer en de simplex naar een ánder lokaal optimum
      # (3,005 -> 3,034 mH). Ze kunnen hier dus niet groen worden, en afronden
      # repareert het niet. Zij dragen de tag `[bytes]` en blijven de
      # VERPLICHTE lokale acceptatie vóór elke commit.
      #
      # Wat hier WEL draait is de helft die er niet aan lijdt, en dat is
      # gemeten en niet aangenomen: op linux-x64/Node 22 reproduceerden
      # `goldenCasus1` (46), `goldenClassification` (12) en
      # `frozenNetlistGates` (49) volledig — de klasse-A/B-referenties zijn
      # rekenwerk op bevroren netlists, zonder zoektocht, en zij horen op élk
      # platform binnen hun tolerantieklasse te reproduceren. Wijken díé hier
      # af, dan is het een echte bug. `ciLayer.test.ts` bewaakt dat ze niet
      # stilletjes uit deze laag kunnen vallen.
      - run: npm run test:ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
